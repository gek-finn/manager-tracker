# Initial HTTP only: no certificate dependency and no password form over HTTP.
server {
    listen 80;
    server_name manager.gilinsky.ru;
    if ($host != manager.gilinsky.ru) { return 444; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/manager-tracker-acme;
        try_files $uri =404;
    }
    location / {
        default_type text/plain;
        return 200 "Manager Tracker HTTP is configured. HTTPS setup pending. Do not enter credentials here.\n";
    }
}
