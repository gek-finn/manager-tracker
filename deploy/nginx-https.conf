# Install only AFTER successful certificate issuance. No parent-domain HSTS.
server {
    listen 80;
    server_name manager.gilinsky.ru;
    if ($host != manager.gilinsky.ru) { return 444; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/manager-tracker-acme;
        try_files $uri =404;
    }
    location / { return 301 https://manager.gilinsky.ru$request_uri; }
}
server {
    listen 443 ssl;
    server_name manager.gilinsky.ru;
    if ($host != manager.gilinsky.ru) { return 444; }
    ssl_certificate /etc/letsencrypt/live/manager.gilinsky.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manager.gilinsky.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:manager_tracker_tls:1m;
    ssl_session_timeout 1d;
    client_max_body_size 128k;
    access_log /var/log/nginx/manager-tracker.access.log;
    error_log /var/log/nginx/manager-tracker.error.log;
    location ~ ^/(instance|backups|deploy|tests|\.git|\.env|\.venv)(/|$) { return 404; }
    location ~* \.(py|pyc|sqlite|sqlite3|db|json|env|log|zip|bak)$ { return 404; }
    location ~ /\. { return 404; }
    location /static/ {
        alias /opt/manager-tracker/static/;
        autoindex off;
    }
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_read_timeout 45s;
        proxy_cache off;
    }
}
