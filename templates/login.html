{% extends 'base.html' %}{% block title %}Вход{% endblock %}{% block content %}
<div class="heading"><div><h1>Вход владельца</h1><p class="muted">Manager Tracker · Контроль клиентских заявок</p></div></div>
{% if error %}<div class="error-box" role="alert">{{ error }}</div>{% endif %}
<form method="post" class="panel form-panel login-panel"><input type="hidden" name="csrf_token" value="{{ session.csrf_token }}"><input type="hidden" name="next" value="{{ next_path }}">
<label for="owner-login">Логин<input id="owner-login" name="login" autocomplete="username" maxlength="100" required></label>
<label for="owner-password">Пароль<input id="owner-password" type="password" name="password" autocomplete="current-password" maxlength="1024" required></label>
<p class="muted">Сессия действует 8 часов с момента входа. Регистрации и гостевого доступа нет.</p><button class="button" type="submit">Войти</button></form>{% endblock %}
